<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>账号中心-因果星空</title>
    <!-- Three.js 驱动底层 3D 粒子与透视经纬线 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts 科技与人文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            min-height: 100%;
            background-color: #010206;
            color: #f1f5f9;
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* 全屏 3D 宇宙 Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* 全屏经纬线近端遮罩 */
        .screen-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(1, 2, 6, 0.15) 0%, rgba(1, 2, 6, 0.8) 80%, rgba(1, 2, 6, 0.98) 100%);
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 顶部标题栏 */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1, .header h3 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, #ffffff 0%, #38bdf8 50%, rgba(192, 132, 252, 0.85) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        /* 状态栏 */
        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            font-size: 0.78rem;
            font-family: 'Orbitron', monospace;
            color: #38bdf8;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* 标签页导航 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .tab {
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(2, 4, 10, 0.65);
            color: #cbd5e1;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
            color: #ffffff;
        }

        .tab.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }

        /* 面板显示控制 */
        .panel {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .panel.active {
            display: flex;
        }

        /* ================= 科技 HUD 切角卡片设计 ================= */
        .card {
            position: relative;
            background: rgba(10, 16, 30, 0.65);
            clip-path: polygon(
                14px 0%, calc(100% - 14px) 0%, 
                100% 14px, 100% calc(100% - 14px), 
                calc(100% - 14px) 100%, 14px 100%, 
                0% calc(100% - 14px), 0% 14px
            );
            border: none;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 1px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.45) 0%, rgba(56, 189, 248, 0.08) 50%, rgba(192, 132, 252, 0.35) 100%);
            clip-path: polygon(
                14px 0%, calc(100% - 14px) 0%, 
                100% 14px, 100% calc(100% - 14px), 
                calc(100% - 14px) 100%, 14px 100%, 
                0% calc(100% - 14px), 0% 14px
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .card:hover::before {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.9) 0%, rgba(56, 189, 248, 0.25) 50%, rgba(192, 132, 252, 0.75) 100%);
        }

        /* 卡片头部 */
        .card-header {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.08) 0%, rgba(15, 23, 42, 0.2) 100%);
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
            transition: background 0.2s ease;
        }

        .card-header:hover {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.18) 0%, rgba(15, 23, 42, 0.4) 100%);
        }

        .card-header h2 {
            font-size: 1.0rem;
            color: #f1f5f9;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin: 0;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
            border-radius: 1px;
        }

        /* 折叠箭头图标 */
        .collapse-icon {
            font-family: 'Orbitron', monospace;
            color: #38bdf8;
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .card.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        /* 卡片主体内容 */
        .card-body {
            padding: 22px;
            max-height: 1200px;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .card.collapsed .card-body {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* 表单样式 */
        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(2, 4, 10, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.25);
            clip-path: polygon(
                6px 0%, calc(100% - 6px) 0%, 
                100% 6px, 100% calc(100% - 6px), 
                calc(100% - 6px) 100%, 6px 100%, 
                0% calc(100% - 6px), 0% 6px
            );
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        input::placeholder {
            color: #475569;
        }

        /* 按钮统一样式 - HUD 科技切角 */
        .btn {
            padding: 12px 24px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(8px);
            clip-path: polygon(
                10px 0%, calc(100% - 10px) 0%, 
                100% 10px, 100% calc(100% - 10px), 
                calc(100% - 10px) 100%, 10px 100%, 
                0% calc(100% - 10px), 0% 10px
            );
        }

        .btn.primary {
            background: rgba(56, 189, 248, 0.22);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn.primary:hover {
            background: rgba(56, 189, 248, 0.4);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        .btn.ghost {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(2, 4, 10, 0.65);
            color: #cbd5e1;
        }

        .btn.ghost:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* ================= 列表与内部操作按钮对齐修复 ================= */
        .list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .item {
            background: rgba(2, 4, 10, 0.55);
            border: 1px solid rgba(56, 189, 248, 0.15);
            clip-path: polygon(
                10px 0%, calc(100% - 10px) 0%, 
                100% 10px, 100% calc(100% - 10px), 
                calc(100% - 10px) 100%, 10px 100%, 
                0% calc(100% - 10px), 0% 10px
            );
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .item:hover {
            border-color: rgba(56, 189, 248, 0.35);
            background: rgba(15, 23, 42, 0.7);
        }

        .item .meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item .meta .name {
            font-size: 0.98rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.05em;
        }

        .item .meta .id {
            font-size: 0.78rem;
            font-family: 'Orbitron', monospace;
            color: #64748b;
        }

        .item .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        /* 小尺寸按钮 */
        .btn.small {
            padding: 7px 14px;
            font-size: 0.78rem;
            clip-path: polygon(
                6px 0%, calc(100% - 6px) 0%, 
                100% 6px, 100% calc(100% - 10px), 
                calc(100% - 6px) 100%, 6px 100%, 
                0% calc(100% - 6px), 0% 6px
            );
        }

        /* 危险操作按钮（科技红光风格） */
        .btn.danger {
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.35);
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }

        /* 获取 API/SKILL 按钮（青紫渐变，区别于主/幽灵按钮） */
        .btn.api {
            border: 1px solid rgba(192, 132, 252, 0.55);
            background: rgba(192, 132, 252, 0.15);
            color: #e9d5ff;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.18);
        }

        .btn.api:hover {
            background: rgba(192, 132, 252, 0.35);
            border-color: #c084fc;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.45);
            transform: translateY(-2px);
        }

        .empty {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            padding: 16px 0;
        }

        .key-new {
            margin-top: 12px;
            word-break: break-all;
            font-family: 'Orbitron', monospace;
            font-size: 0.82rem;
            color: #38bdf8;
            cursor: pointer;
            position: relative;
        }
        
        .key-new:hover::after {
            content: " (点击复制)";
            font-size: 0.75rem;
            color: #10b981;
        }

        /* 底部返回 */
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
        }

        .footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .sep {
            margin: 0 12px;
            color: #334155;
        }

        /* ================= API / SKILL 模态框 ================= */
        .api-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .api-modal.show {
            display: flex;
        }

        .api-modal-mask {
            position: absolute;
            inset: 0;
            background: rgba(1, 2, 6, 0.82);
            backdrop-filter: blur(8px);
        }

        .api-modal-dialog {
            position: relative;
            width: min(860px, 100%);
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            background: rgba(10, 16, 30, 0.92);
            backdrop-filter: blur(16px);
            clip-path: polygon(
                14px 0%, calc(100% - 14px) 0%,
                100% 14px, 100% calc(100% - 14px),
                calc(100% - 14px) 100%, 14px 100%,
                0% calc(100% - 14px), 0% 14px
            );
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.25), 0 0 30px rgba(192, 132, 252, 0.15);
            animation: fadeIn 0.25s ease;
        }

        .api-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.12) 0%, rgba(15, 23, 42, 0.2) 100%);
            border-bottom: 1px solid rgba(56, 189, 248, 0.18);
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #f1f5f9;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
        }

        .api-modal-body {
            margin: 0;
            padding: 20px 22px;
            flex: 1;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', 'Microsoft YaHei', 'PingFang SC', monospace;
            font-size: 0.82rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .api-modal-body::-webkit-scrollbar {
            width: 8px;
        }

        .api-modal-body::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.35);
            border-radius: 4px;
        }

        .api-modal-foot {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 14px 22px;
            border-top: 1px solid rgba(56, 189, 248, 0.15);
        }

        .api-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(2, 4, 10, 0.65);
            color: #cbd5e1;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .api-icon:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 3D 宇宙与经纬线透视 Canvas -->
    <div id="canvas-container"></div>
    
    <!-- 近端满屏淡化遮罩层 -->
    <div class="screen-vignette"></div>

    <div class="container">
        <header class="header">
            <h2>因果星空 · 账号中心</h2>
            <p class="subtitle">actor 身份 · 场 owner · 钥匙 token</p>
            <div class="status-bar" id="status-bar">
                <span class="status-dot"></span>
                <span id="status-text">未登录</span>
            </div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab active" data-tab="actor">🧑 身份</button>
            <button class="tab" data-tab="key">🔑 钥匙</button>
            <button class="tab" data-tab="owner">🏠 场</button>
        </nav>

        <!-- ① actor 注册 / 登录 -->
        <section class="panel active" id="panel-actor">
            <!-- 为登录卡片增加 id="login-card" -->
            <div class="card" id="login-card">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>登录</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <form id="login-form" class="form">
                        <label>actor 身份 ID
                            <input type="text" name="actor_id" id="login-actor" placeholder="例如 user2" autocomplete="username" required>
                        </label>
                        <label>密码
                            <input type="password" name="password" id="login-password" placeholder="输入密码" autocomplete="current-password" required>
                        </label>
                        <button type="submit" class="btn primary">进入我的星空</button>
                    </form>
                </div>
            </div>

            <div class="card collapsed">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>注册新 actor</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <form id="register-form" class="form">
                        <label>actor 身份 ID
                            <input type="text" name="actor_id" id="register-actor" placeholder="例如 zhangsan" autocomplete="username" required>
                        </label>
                        <label>设置密码
                            <input type="password" name="password" id="register-password" placeholder="至少 6 位" autocomplete="new-password" required minlength="6">
                        </label>
                        <button type="submit" class="btn ghost">注册并签发钥匙</button>
                    </form>
                </div>
            </div>

            <div class="card collapsed">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>修改密码</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <form id="change-password-form" class="form">
                        <label>actor 身份 ID
                            <input type="text" name="actor_id" id="change-actor" placeholder="例如 user2" autocomplete="username" required>
                        </label>
                        <label>旧密码
                            <input type="password" name="old_password" id="change-old" placeholder="输入旧密码" autocomplete="current-password" required>
                        </label>
                        <label>新密码
                            <input type="password" name="new_password" id="change-new" placeholder="至少 6 位" autocomplete="new-password" required minlength="6">
                        </label>
                        <button type="submit" class="btn ghost">修改密码</button>
                    </form>
                </div>
            </div>

            <div class="card collapsed">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>忘记密码 · 重置</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <p class="hint">用你名下任意一把有效钥匙验证身份后即可重置密码。</p>
                    <form id="reset-password-form" class="form">
                        <label>actor 身份 ID
                            <input type="text" name="actor_id" id="reset-actor" placeholder="例如 user2" autocomplete="username" required>
                        </label>
                        <label>有效钥匙 token
                            <input type="text" name="token" id="reset-token" placeholder="粘贴一把钥匙" autocomplete="one-time-code" required>
                        </label>
                        <label>新密码
                            <input type="password" name="new_password" id="reset-new" placeholder="至少 6 位" autocomplete="new-password" required minlength="6">
                        </label>
                        <button type="submit" class="btn ghost">重置密码</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- ② 钥匙 token 管理 -->
        <section class="panel" id="panel-key">
            <div class="card collapsed">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>签发新钥匙</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <p class="hint">钥匙用于进入私密场域的“防盗门”鉴权，新钥匙只会显示一次。</p>
                    <button id="key-generate" class="btn primary">签发一把新钥匙</button>
                    <div id="key-new" class="key-new"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>我的钥匙</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <div id="key-list" class="list">
                        <p class="empty">请先登录后查看钥匙</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ③ 场 owner 管理 -->
        <section class="panel" id="panel-owner">
            <div class="card collapsed">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>创建场（场域）</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <form id="owner-form" class="form">
                        <label>场 ID（owner_id）
                            <input type="text" name="owner_id" id="owner-id" placeholder="例如 cbf" autocomplete="off" required>
                        </label>
                        <label>场名称
                            <input type="text" name="name" id="owner-name" placeholder="例如 因果观测站" autocomplete="off" required>
                        </label>
                        <button type="submit" class="btn primary">创建并成为主人</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header" onclick="toggleCard(this)">
                    <h2>我的场</h2>
                    <span class="collapse-icon">▼</span>
                </div>
                <div class="card-body">
                    <div id="owner-list" class="list">
                        <p class="empty">请先登录后查看名下场</p>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer">
            <a href="/">← 返回首页</a>
            <span class="sep">|</span>
        </footer>
    </div>

    <!-- API / SKILL 模态框 -->
    <div class="api-modal" id="api-modal">
        <div class="api-modal-mask" data-close></div>
        <div class="api-modal-dialog">
            <div class="api-modal-head">
                <span>📡 获取 API / SKILL</span>
                <button class="api-icon" id="api-close" title="关闭">✕</button>
            </div>
            <pre class="api-modal-body" id="api-body"></pre>
            <div class="api-modal-foot">
                <button class="btn small primary" id="api-copy">📋 复制</button>
                <button class="btn small ghost" id="api-cancel">✕ 关闭</button>
            </div>
        </div>
    </div>

    <!-- 卡片折叠与背景动画脚本 -->
    <script>
        function toggleCard(headerElement) {
            const card = headerElement.closest('.card');
            card.classList.toggle('collapsed');
        }

        // 根据登录状态自动折叠/展开“登录”卡片
        const loginCard = document.getElementById('login-card');
        const statusText = document.getElementById('status-text');

        function updateLoginCardState() {
            if (!loginCard || !statusText) return;
            const isNotLoggedIn = statusText.textContent.includes('未登录');
            if (isNotLoggedIn) {
                loginCard.classList.remove('collapsed'); // 未登录：展开
            } else {
                loginCard.classList.add('collapsed');    // 已登录：折叠
            }
        }

        // 初始化检查
        updateLoginCardState();

        // 监听状态文本变化，实时响应登录状态的切换
        const statusObserver = new MutationObserver(updateLoginCardState);
        statusObserver.observe(statusText, { childList: true, characterData: true, subtree: true });

        document.addEventListener('click', function(e) {
            const target = e.target;
            if (target.id === 'key-new' || target.classList.contains('token-item') || target.dataset.token) {
                const textToCopy = target.dataset.token || target.innerText.replace(" (点击复制)", "").trim();
                if (!textToCopy) return;

                copyTextToClipboard(textToCopy, target);
            }
        });

        function copyTextToClipboard(text, element) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopiedFeedback(element);
                }).catch(() => {
                    fallbackCopyText(text, element);
                });
            } else {
                fallbackCopyText(text, element);
            }
        }

        function fallbackCopyText(text, element) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopiedFeedback(element);
                } else {
                    alert('复制失败，请手动选中复制');
                }
            } catch (err) {
                alert('浏览器不支持自动复制，请手动选中复制');
            }
            document.body.removeChild(textArea);
        }

        function showCopiedFeedback(element) {
            const originalText = element.innerText;
            element.innerText = "✓ 已成功复制到剪贴板！";
            element.style.color = "#10b981";
            setTimeout(() => {
                element.innerText = originalText;
                element.style.color = "#38bdf8";
            }, 1500);
        }

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010206, 0.001);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.z = 350;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const tunnelGroup = new THREE.Group();

        const ringCount = 30;
        for (let i = 0; i < ringCount; i++) {
            const zPos = -i * 60;
            const radius = 220 + i * 45;
            const ringGeometry = new THREE.BufferGeometry();
            const points = [];
            const segments = 48;

            for (let j = 0; j <= segments; j++) {
                const theta = (j / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * radius, Math.sin(theta) * radius, zPos));
            }

            ringGeometry.setFromPoints(points);
            const opacityVal = i < 2 ? (i * 0.15) : Math.max(0.04, 0.6 - i * 0.018);
            const ringMaterial = new THREE.LineBasicMaterial({
                color: i % 2 === 0 ? 0x38bdf8 : 0xc084fc,
                transparent: true,
                opacity: opacityVal
            });

            const ring = new THREE.Line(ringGeometry, ringMaterial);
            tunnelGroup.add(ring);
        }

        const lineCount = 24;
        for (let k = 0; k < lineCount; k++) {
            const angle = (k / lineCount) * Math.PI * 2;
            const lineGeometry = new THREE.BufferGeometry();
            const startPt = new THREE.Vector3(Math.cos(angle) * 220, Math.sin(angle) * 220, 0);
            const endPt = new THREE.Vector3(Math.cos(angle) * 1800, Math.sin(angle) * 1800, -1800);

            lineGeometry.setFromPoints([startPt, endPt]);
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.18
            });

            const line = new THREE.Line(lineGeometry, lineMaterial);
            tunnelGroup.add(line);
        }

        scene.add(tunnelGroup);

        const particleCount = 1800;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0x38bdf8);
        const color2 = new THREE.Color(0xc084fc);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 1600;
            positions[i + 1] = (Math.random() - 0.5) * 1600;
            positions[i + 2] = (Math.random() - 0.5) * 1600 - 200;

            const c = Math.random() > 0.4 ? color1 : color2;
            colors[i] = c.r;
            colors[i + 1] = c.g;
            colors[i + 2] = c.b;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 2.8,
            vertexColors: true,
            transparent: true,
            opacity: 0.65,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.05;
            mouseY = (event.clientY - windowHalfY) * 0.05;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            tunnelGroup.rotation.z = elapsedTime * 0.025;
            particles.rotation.z = -elapsedTime * 0.012;

            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();
    </script>

    <script src="/static/js/auth.js?v=20261021"></script>
</body>
