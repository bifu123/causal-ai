<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>因果星空</title>
    <script src="/static/js/socket.io.min.js"></script>
    
    <!-- 关键修复：先加载THREE.js -->
    <!-- 使用明确创建全局THREE变量的版本 -->
    <script src="/static/js/three.min.js"></script>
    
    <!-- 添加Tween.js用于相机动画 -->
    <script src="/static/js/tween.umd.js"></script>
    
    <!-- 加载d3.js库（3d-force-graph依赖） -->
    <script src="/static/js/d3.min.js"></script>
    
    <!-- 然后加载3d-force-graph，它会使用已存在的THREE实例 -->
    <script src="/static/js/3d-force-graph.min.js"></script>
    
    <link rel="stylesheet" href="/static/css/3d_main.css?v=20261126shi10">
    <link rel="stylesheet" href="/static/css/3d_form.css">
    <!-- EasyMDE Markdown编辑器 -->
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/easymde.min.css">
    <!-- 全部第三方资源已本地化（内网/无外网环境可用） -->
    <link rel="stylesheet" href="/static/css/katex.min.css">
    <script src="/static/js/marked.min.js"></script>
    <script src="/static/js/katex.min.js"></script>
    <script src="/static/js/marked-katex-extension.umd.js"></script>

    <script src="/static/js/easymde.min.js"></script>
</head>
<body>
    <div id="3d-graph"></div>
    
    <!-- 移动端 header 折叠按钮 -->
    <div id="header-toggle" onclick="document.getElementById('header').classList.toggle('expanded')">➥</div>
    
    <div id="ui-overlay">
        <div id="header">
            <h1>因果星空 · 3D 视觉实现</h1>
            <!-- <div class="subtitle">阶段一：逻辑建模期 · 骨架与巡航</div> -->
            <div class="subtitle"></div>
            <div id="header-hud" class="header-hud">
                <div class="header-hud-row">
                    <span id="hud-serial">序列 <span>-</span></span>
                    <span class="hud-sep">|</span>
                    <span id="hud-weight">权重 <span class="hud-w-val">-</span> <span class="hud-w-stat"></span></span>
                </div>
                <div class="header-hud-event" id="hud-event">-</div>
            </div>
        </div>

        <!-- 相事件的瞬时势：天球星盘弧形仪轨，仅响应 /click，不进入 Three.js 渲染循环 -->
        <div id="shi-meter" class="shi-meter hidden" role="status" aria-live="polite" aria-atomic="true">
            <svg class="shi-meter-svg" viewBox="0 0 800 520" aria-hidden="true">
                <defs>
                    <radialGradient id="shi-dome-glow" cx="50%" cy="0%" r="68%" fx="50%" fy="0%">
                        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20" />
                        <stop offset="48%" stop-color="#0ea5e9" stop-opacity="0.11" />
                        <stop offset="82%" stop-color="#0284c7" stop-opacity="0.04" />
                        <stop offset="100%" stop-color="#020617" stop-opacity="0" />
                    </radialGradient>
                    <linearGradient id="shi-track-grad" x1="18%" y1="0%" x2="82%" y2="0%">
                        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.06" />
                        <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.18" />
                        <stop offset="100%" stop-color="#f6d365" stop-opacity="0.10" />
                    </linearGradient>
                    <linearGradient id="shi-rim-grad" x1="14%" y1="0%" x2="86%" y2="0%">
                        <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0" />
                        <stop offset="12%" stop-color="#7dd3fc" stop-opacity="0.55" />
                        <stop offset="52%" stop-color="#bae6fd" stop-opacity="0.85" />
                        <stop offset="88%" stop-color="#fde68a" stop-opacity="0.72" />
                        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="shi-arc-grad" x1="20%" y1="0%" x2="80%" y2="0%">
                        <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
                        <stop offset="28%" stop-color="#38bdf8" stop-opacity="0.72" />
                        <stop offset="56%" stop-color="#67e8f9" stop-opacity="0.92" />
                        <stop offset="78%" stop-color="#fef08a" stop-opacity="0.98" />
                        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.95" />
                    </linearGradient>
                    <linearGradient id="shi-crest-grad" x1="20%" y1="0%" x2="80%" y2="0%">
                        <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45" />
                        <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.95" />
                        <stop offset="78%" stop-color="#fef9c3" stop-opacity="1" />
                        <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95" />
                    </linearGradient>
                    <linearGradient id="shi-ribbon-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0" />
                        <stop offset="28%" stop-color="#38bdf8" stop-opacity="0.34" />
                        <stop offset="65%" stop-color="#5eead4" stop-opacity="0.22" />
                        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="shi-ribbon-gold" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fde68a" stop-opacity="0" />
                        <stop offset="26%" stop-color="#fde68a" stop-opacity="0.32" />
                        <stop offset="62%" stop-color="#5eead4" stop-opacity="0.20" />
                        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
                    </linearGradient>
                    <filter id="shi-glow" x="-25%" y="-35%" width="150%" height="170%">
                        <feGaussianBlur stdDeviation="5.5" result="blurWide" />
                        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurCore" />
                        <feMerge>
                            <feMergeNode in="blurWide" />
                            <feMergeNode in="blurCore" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="shi-star-glow" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="2.2" result="starBlur" />
                        <feMerge>
                            <feMergeNode in="starBlur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <g class="shi-astrolabe-dome">
                    <circle cx="400" cy="-12" r="346" fill="url(#shi-dome-glow)" />
                    <circle cx="400" cy="-12" r="346" fill="none" stroke="rgba(125, 211, 252, 0.34)" stroke-width="1.2" />
                    <circle cx="400" cy="-12" r="338" fill="none" stroke="rgba(125, 211, 252, 0.28)" stroke-width="5" stroke-dasharray="1 5.2" />
                    <circle cx="400" cy="-12" r="338" fill="none" stroke="rgba(186, 230, 253, 0.42)" stroke-width="8" stroke-dasharray="1.4 31.2" />
                    <circle cx="400" cy="-12" r="330" fill="none" stroke="rgba(125, 211, 252, 0.24)" stroke-width="1" />
                    <circle cx="400" cy="-12" r="276" fill="none" stroke="rgba(125, 211, 252, 0.14)" stroke-width="0.9" stroke-dasharray="3 5" />
                    <circle cx="400" cy="-12" r="218" fill="none" stroke="rgba(125, 211, 252, 0.15)" stroke-width="0.9" />
                    <circle cx="400" cy="-12" r="154" fill="none" stroke="rgba(125, 211, 252, 0.12)" stroke-width="0.8" stroke-dasharray="2 4" />
                    <ellipse cx="400" cy="-12" rx="330" ry="195" fill="none" stroke="rgba(125, 211, 252, 0.13)" stroke-width="0.9" transform="rotate(-14 400 -12)" />
                    <ellipse cx="400" cy="-12" rx="330" ry="195" fill="none" stroke="rgba(125, 211, 252, 0.11)" stroke-width="0.9" transform="rotate(14 400 -12)" />
                    <line x1="400" y1="0" x2="400" y2="334" stroke="rgba(125, 211, 252, 0.18)" stroke-width="0.9" />
                    <line x1="400" y1="-12" x2="227" y2="288" stroke="rgba(125, 211, 252, 0.14)" stroke-width="0.85" />
                    <line x1="400" y1="-12" x2="573" y2="288" stroke="rgba(125, 211, 252, 0.14)" stroke-width="0.85" />
                    <line x1="400" y1="-12" x2="100" y2="161" stroke="rgba(125, 211, 252, 0.13)" stroke-width="0.85" />
                    <line x1="400" y1="-12" x2="700" y2="161" stroke="rgba(125, 211, 252, 0.13)" stroke-width="0.85" />
                    <line x1="400" y1="-12" x2="66" y2="78" stroke="rgba(125, 211, 252, 0.10)" stroke-width="0.8" />
                    <line x1="400" y1="-12" x2="734" y2="78" stroke="rgba(125, 211, 252, 0.10)" stroke-width="0.8" />
                    <polyline points="148,54 196,92 252,74 294,126 238,162" fill="none" stroke="rgba(186, 230, 253, 0.24)" stroke-width="0.9" />
                    <polyline points="646,48 594,88 542,68 506,122 564,158" fill="none" stroke="rgba(186, 230, 253, 0.24)" stroke-width="0.9" />
                    <polyline points="318,46 364,76 436,72 484,42" fill="none" stroke="rgba(186, 230, 253, 0.18)" stroke-width="0.8" />
                    <g fill="#e0f2fe" filter="url(#shi-star-glow)">
                        <circle cx="148" cy="54" r="2.1" opacity="0.85" />
                        <circle cx="196" cy="92" r="2.6" opacity="0.92" />
                        <circle cx="252" cy="74" r="1.9" opacity="0.78" />
                        <circle cx="294" cy="126" r="2.3" opacity="0.85" />
                        <circle cx="238" cy="162" r="1.8" opacity="0.72" />
                        <circle cx="646" cy="48" r="2.1" opacity="0.85" />
                        <circle cx="594" cy="88" r="2.7" opacity="0.95" />
                        <circle cx="542" cy="68" r="1.9" opacity="0.78" />
                        <circle cx="506" cy="122" r="2.3" opacity="0.86" />
                        <circle cx="564" cy="158" r="1.8" opacity="0.74" />
                        <circle cx="364" cy="76" r="1.7" opacity="0.70" />
                        <circle cx="436" cy="72" r="1.8" opacity="0.72" />
                    </g>
                </g>
                <g class="shi-energy-ribbons" fill="none">
                    <path d="M 218 216 C 312 284, 376 348, 396 515" stroke="url(#shi-ribbon-cyan)" stroke-width="1.8" />
                    <path d="M 258 188 C 338 268, 392 342, 404 515" stroke="url(#shi-ribbon-cyan)" stroke-width="1.2" />
                    <path d="M 582 216 C 488 284, 424 348, 404 515" stroke="url(#shi-ribbon-gold)" stroke-width="2.0" />
                    <path d="M 542 188 C 462 268, 408 342, 394 515" stroke="url(#shi-ribbon-gold)" stroke-width="1.3" />
                    <path d="M 612 242 C 546 310, 434 380, 412 515" stroke="url(#shi-ribbon-cyan)" stroke-width="1.1" />
                    <path d="M 188 242 C 254 310, 366 380, 388 515" stroke="url(#shi-ribbon-cyan)" stroke-width="1.0" />
                </g>
                <g class="shi-dial-arcs">
                    <path d="M 177.7 251.0 A 286 286 0 0 1 622.3 251.0"
                          fill="none" stroke="url(#shi-rim-grad)" stroke-width="2" stroke-linecap="round" />
                    <path d="M 201.1 245.5 A 272 272 0 0 1 598.9 245.5"
                          fill="none" stroke="url(#shi-track-grad)" stroke-width="22" stroke-linecap="butt" />
                    <path d="M 206.8 257.0 A 260 260 0 0 1 593.2 257.0"
                          fill="none" stroke="rgba(125, 211, 252, 0.24)" stroke-width="1" />
                    <path d="M 217.3 254.5 A 254 254 0 0 1 582.7 254.5"
                          fill="none" stroke="rgba(186, 230, 253, 0.36)" stroke-width="8"
                          stroke-dasharray="1.2 6.95" />
                    <path d="M 220.2 257.3 A 250 250 0 0 1 579.8 257.3"
                          fill="none" stroke="rgba(224, 242, 254, 0.68)" stroke-width="15"
                          stroke-dasharray="1.6 38.6" />
                    <path id="shi-meter-arc" class="shi-meter-arc"
                          d="M 201.1 245.5 A 272 272 0 0 1 598.9 245.5"
                          pathLength="100" fill="none" stroke="url(#shi-arc-grad)"
                          stroke-width="22" stroke-linecap="butt" filter="url(#shi-glow)" />
                    <path id="shi-meter-arc-crest" class="shi-meter-arc-crest"
                          d="M 193.0 238.0 A 283 283 0 0 1 607.0 238.0"
                          pathLength="100" fill="none" stroke="url(#shi-crest-grad)"
                          stroke-width="2.6" stroke-linecap="round" filter="url(#shi-glow)" />
                </g>
                <g class="shi-core-rings">
                    <circle cx="400" cy="272" r="72" fill="rgba(2, 6, 23, 0.58)" stroke="rgba(125, 211, 252, 0.20)" stroke-width="1" />
                    <circle cx="400" cy="272" r="67" fill="none" stroke="rgba(226, 232, 240, 0.42)" stroke-width="5" stroke-dasharray="1.1 3.4" />
                    <circle cx="400" cy="272" r="61" fill="rgba(7, 13, 28, 0.78)" stroke="rgba(241, 245, 249, 0.84)" stroke-width="1.8" filter="url(#shi-star-glow)" />
                    <circle cx="400" cy="272" r="55" fill="none" stroke="rgba(186, 230, 253, 0.45)" stroke-width="1" />
                    <path d="M 354 237 A 58 58 0 0 1 446 237" fill="none" stroke="rgba(254, 249, 195, 0.65)" stroke-width="1.6" stroke-linecap="round" />
                    <path d="M 360 310 A 56 56 0 0 0 440 310" fill="none" stroke="rgba(125, 211, 252, 0.45)" stroke-width="1.3" stroke-linecap="round" />
                </g>
            </svg>
            <div class="shi-meter-heading">
                <span id="shi-meter-state" class="shi-meter-state">正在观测</span>
                <span class="shi-meter-title">无寿者相</span>
            </div>
            <div class="shi-meter-core">
                <output id="shi-meter-value" class="shi-meter-value">—</output>
            </div>
            <div id="shi-meter-detail" class="shi-meter-detail">正在生成当前相事件视界</div>
        </div>
        
        <div id="node-info">
            <!-- <h3>节点详情</h3>
            <div class="info-row">
                <div class="info-label">ID:</div>
                <div class="info-value" id="info-node-id">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">动作标签:</div>
                <div class="info-value" id="info-action-tag">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">因缘标签:</div>
                <div class="info-value" id="info-block-tag">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">权重:</div>
                <div class="info-value" id="info-weight">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">父节点:</div>
                <div class="info-value" id="info-parents">-</div>
            </div>
            <div class="info-row"> -->
                <div class="info-label">事件叙述:</div>
                <div class="info-value" id="info-event-tuple">-</div>
            </div>
        </div>
        
        <div id="controls">
            <div class="control-icon" id="btn-fit-view" data-tooltip="上帝视角" onclick="handleFitViewClick()">
                <div class="icon-zoom">⛶</div>
            </div>
            <div class="control-icon" id="btn-dragon-cruise" data-tooltip="因果寻龙">
                <div class="icon-compass">➤</div>
            </div>
            <div class="control-icon owner-edit-only hidden" id="btn-create-node" data-tooltip="发起首贞">
                <div class="icon-plus">贞</div>
            </div>
        </div>

        <!-- 望远镜控制面板 -->
        <div id="telescope-panel">
            <input type="range" id="telescope-slider" class="telescope-slider" min="0" max="100" step="1" value="{{ max_eyes }}">
        </div>

        <!-- 屏幕中央瞄准刻度：无外圈水平刻度 + 滑块 -->
        <div id="telescope-reticle" class="hidden">
            <div class="reticle-scale">
                <div class="reticle-track">
                    <div class="reticle-tick" style="left: 0%;"></div>
                    <div class="reticle-tick" style="left: 10%;"></div>
                    <div class="reticle-tick" style="left: 20%;"></div>
                    <div class="reticle-tick" style="left: 30%;"></div>
                    <div class="reticle-tick" style="left: 40%;"></div>
                    <div class="reticle-tick reticle-tick-center" style="left: 50%;"></div>
                    <div class="reticle-tick" style="left: 60%;"></div>
                    <div class="reticle-tick" style="left: 70%;"></div>
                    <div class="reticle-tick" style="left: 80%;"></div>
                    <div class="reticle-tick" style="left: 90%;"></div>
                    <div class="reticle-tick" style="left: 100%;"></div>
                    <div class="reticle-thumb" id="reticle-thumb"></div>
                </div>
            </div>
            <div class="reticle-value" id="reticle-value-display">30</div>
        </div>

        <!-- 星际导航盘 -->
        <div id="nav-container">
            <div id="nav-pad">
                <div class="nav-row">
                    <div class="nav-btn nav-in" data-dir="in" title="向深处飞行">＋</div>
                    <div class="nav-btn nav-up" data-dir="up" title="向上平移">▲</div>
                    <div class="nav-btn nav-out" data-dir="out" title="向近处退回">－</div>
                </div>
                <div class="nav-row">
                    <div class="nav-btn nav-left" data-dir="left" title="向左平移">◀</div>
                    <div class="nav-btn nav-center" data-dir="reset" title="复位到标准观测点">⌂</div>
                    <div class="nav-btn nav-right" data-dir="right" title="向右平移">▶</div>
                </div>
                <div class="nav-row">
                    <div class="nav-btn empty"></div>
                    <div class="nav-btn nav-down" data-dir="down" title="向下平移">▼</div>
                    <div class="nav-btn empty"></div>
                </div>
            </div>
            <div id="nav-toggle" title="拖拽移动 / 点击折叠">🔋</div>
        </div>
        
        <!-- 搜索面板 - 右上角可折叠 -->
        <div id="search-panel">
            <!-- 搜索图标按钮 - 默认显示 -->
            <div class="search-toggle" id="btn-toggle-search" title="展开搜索面板">
                🔍
            </div>
            
            <!-- 搜索表单容器 - 默认隐藏 -->
            <div class="search-form-container" id="search-form-container">
                <div class="search-form-header">
                    <div class="search-form-title">事件搜索</div>
                    <div class="search-form-close" id="btn-close-search" title="关闭搜索面板">✕</div>
                </div>
                
                <div class="search-input-group">
                    <input type="text" id="search-input" class="search-input" placeholder="输入关键词搜索事件...">
                    <select id="search-type" class="search-select">
                        <option value="keyword">关键字搜索</option>
                        <option value="vector">语义搜索</option>
                        <option value="serial">序列ID搜索</option>
                    </select>
                </div>
                
                <button id="btn-search" class="search-submit-button">搜索</button>
                
                <!-- 搜索结果区域 - 默认隐藏 -->
                <div id="search-results" class="search-results" style="display: none;">
                    <div class="search-empty">输入关键词开始搜索</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 抽屉：节点增删改功能 -->
    <div id="drawer" class="drawer drawer-hidden">
        <div class="drawer-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <h2>龙穴详情</h2>
                <button id="btn-collapse-drawer" class="drawer-collapse-btn" title="折叠抽屉">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
            <button id="btn-close-drawer" class="drawer-close" title="关闭并取消选择">✕</button>
        </div>
        
        <div class="drawer-content">
            <section>
                <label class="drawer-label">卜辞（最简二元组描述）</label>
                <input id="d-node-id" type="text" class="drawer-input">
            </section>

            <section>
                <label class="drawer-label">动作标签 (Action Tag)</label>
                <select id="d-action-tag" class="drawer-select">
                    <option value="贞">贞</option>
                    <option value="又贞">又贞</option>
                    <option value="对贞">对贞</option>
                </select>
            </section>

            <section>
                <label class="drawer-label">因缘标签 (Block Tag)</label>
                <select id="d-block-tag" class="drawer-select">
                    <option value="因">因 (原因/起因)</option>
                    <option value="相">相 (现象/状态)</option>
                    <option value="果">果 (结果/成果)</option>
                </select>
            </section>

            <section class="copy-edit-only">
                <label class="drawer-label">父节点 ID (Parent IDs)</label>
                <div class="relative">
                    <input id="d-parent-ids" type="text" class="drawer-input" placeholder="点击节点图标自动填充，多个ID用|分隔">
                    <div class="drawer-hint hidden" id="parent-id-hint">点击节点填充</div>
                </div>
                <div class="drawer-tip">
                    提示：点击此输入框获得焦点后，再点击图中的节点图标，节点ID将自动填入
                </div>
            </section>

            <section>
                <label class="drawer-label">事件叙述 (Event Tuple)</label>
                <div class="relative">
                    <textarea id="d-event-tuple" class="drawer-textarea"></textarea>
                    <!-- 放大图标 -->
                    <button id="expand-event-tuple-btn" class="expand-btn" title="放大编辑">⛶</button>
                </div>
            </section>

            <section>
                <label class="drawer-label">生存权重 (Survival Weight)</label>
                <div class="weight-container">
                    <div class="weight-bar-bg">
                        <div id="d-weight-bar" class="weight-bar-fill"></div>
                    </div>
                    <span id="d-weight-value" class="weight-value">0.0000</span>
                </div>
            </section>

            <section>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label class="drawer-label" style="margin-bottom: 0;">对外场开放 (is_share)</label>
                    <input id="d-is-share" type="checkbox" style="cursor: pointer;">

    <script>
        // 从URL参数获取用户ID和拥有者ID
        function getActorIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const actorId = urlParams.get('actor_id');
            return actorId || '';
        }
        
        function getOwnerIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const ownerId = urlParams.get('owner_id');
            return ownerId || 'default';
        }
        
        function getBotIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('bot_id') || '';
        }
        
        // 设置全局用户ID和拥有者ID变量
        // 服务端已依据 token 裁决身份：优先使用服务端解析出的 actor_id（防冒名）
        window.currentActorId = {{ (resolved_actor_id or '') | tojson }};
        window.currentOwnerId = {{ (resolved_owner_id or getOwnerIdFromURL()) | tojson }};
        window.currentBotId = getBotIdFromURL();
        // 服务端裁决的角色矩阵（anonymous / observer / owner / admin）
        window.ACCESS_SEED = {{ (access or {}) | tojson }};

        // 身份漂移：URL 中的 actor_id 与服务端裁决结果不一致时提示（token 身份优先）
        const urlActorId = getActorIdFromURL();
        if (urlActorId && window.currentActorId && urlActorId !== window.currentActorId) {
            console.warn(`[鉴权] URL actor_id="${urlActorId}" 与钥匙身份 "${window.currentActorId}" 不一致，以钥匙身份为准`);
        }
        
        // 配置Socket.IO连接，确保与服务器兼容（带上 owner_id/actor_id 用于房间隔离）
        const socket = io({
            path: '/socket.io',
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000,
            query: {
                owner_id: window.currentOwnerId,
                actor_id: window.currentActorId || '',
                role: (window.ACCESS_SEED && window.ACCESS_SEED.role) || ''
            }
        });
        
        // 设置全局socket变量供其他脚本使用
        window.socket = socket;
        
        // 初始化用户ID和拥有者ID显示
        const accessSeed = window.ACCESS_SEED || {};
        if (window.currentActorId || window.currentOwnerId !== 'default') {
            console.log(`[用户初始化] 服务端裁决: actor_id=${window.currentActorId}, owner_id=${window.currentOwnerId}, role=${accessSeed.role}`);
            // 可以在页面上显示当前用户ID和拥有者ID
            const header = document.querySelector('#header h1');
            if (header) {
                let infoHtml = ` <span id="access-badge" style="font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #1f2937; color: #10b981;">${accessSeed.role || 'anonymous'}</span>`;
                if (window.currentActorId) {
                    infoHtml += ` <span style="font-size: 14px;">观察者: <font color="#10b981">${window.currentActorId}</font></span>`;
                }
                if (window.currentOwnerId !== 'default') {
                    infoHtml += ` <span style="font-size: 14px;">场主: <font color="#10b981">${window.currentOwnerId}</font></span>`;
                }
                header.innerHTML += infoHtml;
            }
        } else {
            console.log(`[用户初始化] 未指定用户ID和拥有者ID，使用默认视图（匿名浏览）`);
        }
    </script>
